name: Build and Release A2 Miguel

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Windows PC Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare Release Artifacts (APK & PC Package)
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/A2-Miguel-TV.apk || cp $(find app/build/outputs/apk/ -name "*.apk" | head -n 1) release-output/A2-Miguel-TV.apk

          # Package Windows PC Executable Launchers
          mkdir -p pc-package
          cp Abrir-no-PC.bat pc-package/
          cp Instalar-Atalho-PC.bat pc-package/
          cp README.md pc-package/
          cd pc-package && zip -r ../release-output/A2-Miguel-PC-Windows.zip * && cd ..

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A2-Miguel-Release-Files
          path: release-output/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "A2 Miguel - Versão Oficial TV & PC (${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }})"
          body: |
            ### 🎬 A2 Miguel - Aplicativo Oficial de Filmes, Séries e Animes

            **Arquivos disponíveis para download nesta Release:**
            1. 📱 **`A2-Miguel-TV.apk`**: Instalador completo para Smart TV, TV Box Android (Aquário, Mi Box, Fire TV) e celulares.
            2. 💻 **`A2-Miguel-PC-Windows.zip`**: Pacote de inicialização em janela nativa dedicada para Computador (Windows), incluindo atalho com 1 clique para a Área de Trabalho.

            ---

            ### 🚀 Novos Recursos Inclusos:
            - 📥 **Janela Dedicada de Download & Edição (PC e TV)**:
              - Escolha a pasta de salvamento (`Downloads`, `Filmes`, `Séries`).
              - Selecione a qualidade do vídeo (`1080p Full HD`, `720p HD`, `480p Rápido` ou `Original`).
              - Edite o nome do arquivo antes de baixar.
              - Atalho rápido no teclado: pressione a tecla **`D`** no PC para abrir a janela!
            - 🔍 **Controle de Zoom da Tela & Enquadramento**: Modos Normal (100%), Ajustar (115%), Cinema (130%) e Tela Cheia (150%) para eliminar barras pretas.
            - 🎯 **Calibração de Foco Automático**: Mira com controle remoto para salvar a posição do Play em todos os vídeos.
            - 🎮 **Atalhos no Controle**: Volume `+`/`-` troca episódios; setas avançam/retrocedem 10s.
            - 🛡️ **Autoplay Dublado & Sem Anúncios**.
          files: release-output/*
          draft: false
          prerelease: false
