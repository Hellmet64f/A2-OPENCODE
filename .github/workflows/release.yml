name: Build and Release A2 Miguel

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Windows PC Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Generate Single Self-Contained PC .bat & Prepare Release Artifacts
        run: |
          python3 scripts/build_pc_bat.py
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/A2-Miguel-TV.apk || cp $(find app/build/outputs/apk/ -name "*.apk" | head -n 1) release-output/A2-Miguel-TV.apk

          # O pacote ZIP de PC deve conter APENAS o arquivo único A2-Miguel-PC.bat
          rm -rf pc-package
          mkdir -p pc-package
          cp A2-Miguel-PC.bat pc-package/
          cd pc-package && zip -j ../release-output/A2-Miguel-PC-Windows.zip A2-Miguel-PC.bat && cd ..
          unzip -l release-output/A2-Miguel-PC-Windows.zip

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A2-Miguel-Release-Files
          path: release-output/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "A2 Miguel - Filmes e Séries Celular, TV & PC (${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }})"
          body: |
            ### 🎬 A2 Miguel — Filmes e Séries (Celular, TV & Windows PC)

            **Arquivos disponíveis para download nesta Release:**
            1. 📱 **`A2-Miguel-TV.apk`**: Aplicativo completo focado em **Celular Android**, **Tablets** e **Smart TVs / TV Box** com busca ao vivo, catálogo completo, AdBlock 70+ auto-atualizável, histórico de episódios ("Já Visto"), troca de temporada e sincronização em nuvem + backup JSON gratuito.
            2. 💻 **`A2-Miguel-PC-Windows.zip`**: Contém **apenas 1 arquivo (`A2-Miguel-PC.bat`)**! Basta extrair e dar dois cliques que ele instala tudo automaticamente na pasta `Downloads\A2-Miguel-PC`, cria o atalho na Área de Trabalho, sobe o servidor local com AdBlock 70+ e abre a janela dedicada no PC.

            ---

            ### 🚀 Destaques da Atualização:
            - 🛡️ **Motor AdBlock 70+ Auto-Atualizável**: Proteção contra popups, redirecionamentos, rastreadores e anúncios de apostas no Celular e no PC.
            - 🔍 **Busca Rápida em Tempo Real + Histórico Recente**: Encontre qualquer filme ou série instantaneamente com filtros `Todos / Filmes / Séries`.
            - 📺 **Séries Completas no Player**: Troque de temporada, volte/avance episódios (`Ep Anterior` / `Próx Ep`), reinicie do início (`↺ Reiniciar`) e acompanhe o selo **✓ Já Visto**.
            - 💾 **Dados Salvos Gratuitamente**: Nuvem Google no Android + Backup JSON portátil compatível entre Celular e PC.
            - 📥 **Download & Edição (`Tecla D`) + Zoom (`Tecla Z`)**: Renomeie arquivos, escolha pasta e ajuste o enquadramento.
          files: release-output/*
          draft: false
          prerelease: false
