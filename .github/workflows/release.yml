name: Build and Release A2 Miguel

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/A2-Miguel-TV.apk || cp $(find app/build/outputs/apk/ -name "*.apk" | head -n 1) release-output/A2-Miguel-TV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A2-Miguel-APK
          path: release-output/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "A2 Miguel - Versão Oficial (${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }})"
          body: |
            ### 🎬 A2 Miguel - Aplicativo de Filmes, Séries e Animes

            **Recursos inclusos:**
            - 🔍 **Controle de Zoom e Enquadramento da Tela**: Modos Normal (100%), Ajustar (115%), Cinema (130%) e Tela Cheia (150%) para eliminar barras pretas na TV.
            - 🎮 **Atalho no Controle Remoto**: Tecla Amarela / Zoom alterna os modos de zoom rapidamente com indicador na tela.
            - ⏭️ **Troca de Episódios**: Volume `+` avança para o próximo episódio e Volume `-` volta ao anterior.
            - ⏩ **Controle de Reprodução**: Setas Esquerda/Direita avançam e retrocedem 10 segundos.
            - 🛡️ **Autoplay Dublado & No Ads**: Reprodução automática em português sem propagandas intrusivas.
            - 💻 **Modo PC**: Execute o arquivo `Abrir-no-PC.bat` para rodar como aplicativo de desktop no Windows!

            **Como usar na TV Box:**
            1. Baixe o arquivo `A2-Miguel-TV.apk` abaixo.
            2. Transfira para um pendrive ou use um gerenciador de arquivos na sua TV Box para instalar.
          files: release-output/*.apk
          draft: false
          prerelease: false
